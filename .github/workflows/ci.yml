name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Same image the Dockerfiles build from.
    container: python:3.9-slim
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r worker/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest
